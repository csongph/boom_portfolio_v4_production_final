<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Photography portfolio by BOOM. Visual-first albums for portrait, event, studio, fashion, graduation, and selected work."><link rel="canonical" href="https://boom-portfolio-v4-production-final.vercel.app/photography.html"><meta property="og:title" content="Photography — BOOM"><meta property="og:description" content="Moments BOOM has captured across selected photography albums."><meta property="og:type" content="website"><meta property="og:image" content="/static/images/cs-photo-profile.webp"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#f6f1e8"><link rel="icon" href="/static/images/cs-photo-profile.webp"><title>Photography — BOOM</title><link rel="stylesheet" href="/static/css/style.css?v=54"><style>.category-filter-row .filter-chip{display:inline-flex;align-items:center;gap:7px}.category-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.08);font-size:10px;line-height:1;color:inherit}.category-filter-row .filter-chip.active .category-count{background:rgba(255,255,255,.18)}</style></head><body><header class="container nav"><a class="brand" href="/" data-name>BOOM</a><button class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button><nav class="nav-links"><a href="/">Home</a><a href="/work.html">Coding</a><a href="/photography.html">Photography</a><a href="/about.html">About</a><a href="/contact.html">Contact</a></nav></header><main class="container section photography-page"><div class="section-head portfolio-head"><div><div class="eyebrow">Photography</div><h1 class="page-title">Photography</h1><p class="muted">Moments I've captured.</p></div></div><section class="featured-photography" aria-labelledby="featuredTitle"><div class="featured-heading"><div><div class="eyebrow">Audience favorites</div><h2 id="featuredTitle">Featured Photography</h2><p class="muted">The photographs people are responding to most right now.</p></div><span class="featured-live"><i></i> Live ranking</span></div><div id="featuredPhotoGrid" class="featured-photo-grid" aria-live="polite"></div></section><section class="all-albums" aria-labelledby="albumsTitle"><div class="album-list-heading"><div><div class="eyebrow">Collections</div><h2 id="albumsTitle">Explore all albums</h2></div><div id="albumFilters" class="filter-row category-filter-row" aria-label="Album categories"></div></div><div id="albumGrid" class="grid album-grid"></div></section></main><footer class="footer"><div class="container footer-inner"><strong data-name>BOOM</strong><span data-headline>Developer & Photographer</span></div></footer><script src="/static/js/site.js?v=57"></script><script>
(()=>{'use strict';
const filters=document.getElementById('albumFilters'),grid=document.getElementById('albumGrid');
if(!filters||!grid)return;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function categoryName(value){const raw=String(value||'').trim();if(!raw)return'Photography';const text=raw.toLowerCase();if(/selected|คัดสรร|ผลงานเด่น/.test(text))return'Selected Work';if(/graduat|รับปริญญา/.test(text))return'Graduation';if(/fashion|แฟชั่น/.test(text))return'Fashion';if(/studio|สตูดิโอ/.test(text))return'Studio';if(/event|อีเวนต์/.test(text))return'Event';if(/portrait|พอร์ตเทรต/.test(text))return'Portrait';return raw;}
function waitForAlbumRender(timeout=5000){return new Promise(resolve=>{if(grid.querySelector('.album-card-mini')||grid.querySelector('.empty'))return resolve();const started=Date.now();const observer=new MutationObserver(()=>{if(grid.querySelector('.album-card-mini')||grid.querySelector('.empty')){observer.disconnect();resolve()}});observer.observe(grid,{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();resolve()},timeout)})}
async function installDynamicCategories(){let rows=[];try{const response=await fetch('/api/albums',{cache:'no-store'});if(response.ok)rows=await response.json()}catch{}
await waitForAlbumRender();
const counts=new Map();for(const album of rows){const name=categoryName(album.category);counts.set(name,(counts.get(name)||0)+1)}
const categories=[...counts.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
if(!categories.length){filters.innerHTML='';filters.hidden=true;return}
filters.hidden=false;
const total=rows.length;
filters.innerHTML=`<button class="filter-chip active" type="button" data-category="" aria-pressed="true"><span>All</span><span class="category-count">${total}</span></button>`+categories.map(name=>`<button class="filter-chip" type="button" data-category="${escapeHtml(name)}" aria-pressed="false"><span>${escapeHtml(name)}</span><span class="category-count">${counts.get(name)}</span></button>`).join('');
function apply(name,updateUrl=true){const target=name||'';grid.querySelectorAll('.album-card-mini').forEach(card=>{const own=categoryName(card.dataset.category);card.hidden=!!target&&own!==target});filters.querySelectorAll('.filter-chip').forEach(button=>{const active=(button.dataset.category||'')===target;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});if(updateUrl){const url=new URL(location.href);target?url.searchParams.set('category',target):url.searchParams.delete('category');history.replaceState({},'',url)}}
filters.onclick=event=>{const button=event.target.closest('.filter-chip');if(button)apply(button.dataset.category||'')};
const requested=new URLSearchParams(location.search).get('category');apply(requested&&categories.includes(requested)?requested:'',false);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installDynamicCategories,{once:true});else installDynamicCategories();
})();
</script></body></html>
