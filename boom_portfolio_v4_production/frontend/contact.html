<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact BOOM for developer projects, photography work, collaborations, GitHub, Instagram, Facebook, LINE, and email.">
  <link rel="canonical" href="https://boom-portfolio-v4-production-final.vercel.app/contact.html">
  <meta property="og:title" content="Contact — BOOM">
  <meta property="og:description" content="Let's create something together. Contact BOOM for coding and photography work.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/static/img/boom-profile.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f6f1e8">
  <link rel="icon" href="/static/img/boom-profile.jpg">
  <title>Contact — BOOM</title>
  <link rel="stylesheet" href="/static/css/style.css?v=49">
</head>
<body>
  <header class="container nav">
    <a class="brand" href="/" data-name>BOOM</a>
    <button class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/work.html">Coding</a>
      <a href="/photography.html">Photography</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </header>

  <main class="container section contact-page">
    <div class="contact-layout">
      <section class="contact-copy">
        <div class="eyebrow">Contact</div>
        <h1 class="page-title contact-title" data-contact-heading>Let's create something together.</h1>
        <p class="contact-intro muted" data-contact-intro>Reach out for website projects, photography work, or a new idea you want to build.</p>

        <div class="availability">
          <span class="availability-dot"></span>
          <span data-availability>Available for selected projects</span>
        </div>

        <div id="primaryContactActions" class="contact-actions"></div>

        <section class="contact-panel">
          <div class="eyebrow">Direct</div>
          <div class="contact-direct">
            <a class="contact-direct-item" data-email></a>
            <a class="contact-direct-item" data-phone></a>
            <div class="contact-direct-item muted" data-location></div>
          </div>
        </section>
      </section>

      <section class="contact-side">
        <div class="contact-panel">
          <div class="section-head compact-head">
            <div>
              <div class="eyebrow">Find me online</div>
              <h2>Social & Contact</h2>
            </div>
          </div>
          <div id="contactChannels" class="contact-channel-grid"></div>
          <div id="contactSocials" class="contact-socials"></div>
        </div>

      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <strong data-name>BOOM</strong>
      <span data-headline>Developer & Photographer</span>
    </div>
  </footer>
  <script src="/static/js/site.js?v=49"></script>
</body>
</html>
